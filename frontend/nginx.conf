server {
    listen 80;
    server_name localhost;

    # Define o diretório raiz onde o Vite joga o build
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # A MÁGICA ACONTECE AQUI:
        # 1. Tenta achar o arquivo exato ($uri)
        # 2. Tenta achar um diretório com esse nome ($uri/)
        # 3. Se não achar nenhum, redireciona para o index.html (deixando o React Router assumir)
        try_files $uri $uri/ /index.html;
    }

    # Melhoria de Performance: Cache para arquivos estáticos (CSS, JS, Imagens)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}