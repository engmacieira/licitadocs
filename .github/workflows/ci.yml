name: CI/CD - LicitaDoc Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false 
      matrix:
        test-group: 
          - "app/tests/services app/tests/core app/tests/utils app/tests/models app/tests/schemas"
          - "app/tests/test_*router*.py"
          - "app/tests/test_*repository*.py app/tests/test_*security*.py"
          - "app/tests/test_stress*.py app/tests/test_auth*.py app/tests/test_ai_*.py"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licitadocs_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5435/licitadocs_test
        run: alembic upgrade head

      - name: Run Backend Tests (${{ matrix.test-group }})
        run: python -m pytest ${{ matrix.test-group }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5435/licitadocs_test  

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test -- --run 

  # ==========================================
  # 🚀 FASE DE DEPLOY (CD)
  # ==========================================
  deploy-staging:
    name: Deploy para AWS EC2
    runs-on: ubuntu-latest
    # A MÁGICA AQUI: O deploy SÓ acontece se os dois jobs acima passarem!
    needs: [backend-tests, frontend-tests] 
    
    # Regra de Segurança: Só faz deploy se o código estiver indo para a branch main ou master
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Executando Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  
            cd ~/licitadocs
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            docker compose -f docker-compose.staging.yaml up -d --build
            docker compose exec -T backend alembic upgrade head
            docker system prune -af --volumes