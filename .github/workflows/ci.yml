name: 🧪 Lab CI - Teste de Fluxo Jules

on: [push]

jobs:
  # ---------------------------------------------------------
  # 🤖 JOB 01: OTIMIZAÇÃO (SÓ RODA PARA O HUMANO)
  # ---------------------------------------------------------
  jules-optimization:
    # REGRA: Se for você (engmacieira) E não for um commit da IA
    if: |
      github.actor == 'engmacieira' && 
      !startsWith(github.event.head_commit.message, '🤖 AI (Jules):') &&
      !contains(github.event.head_commit.message, '[skip jules]')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar Dependências Mínimas
        run: pip install requests

      - name: 🤖 Acionar Jules (Agente Único)
        env:
          JULES_API_KEY: ${{ secrets.JULES_AI_API_KEY }}
        run: python jules/teste_loop.py

  # ---------------------------------------------------------
  # 🚀 JOB 02: DEPLOY E TESTES (SÓ RODA PARA A IA)
  # ---------------------------------------------------------
  real-tests-and-deploy:
    # REGRA: Só entra aqui se o commit começar com o prefixo do Jules
    if: |
      startsWith(github.event.head_commit.message, '🤖 AI (Jules):') ||
      contains(github.event.head_commit.message, '[skip jules]')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Validação de Segurança do Deploy
        run: |
          echo "✅ Gatilho detectado: O Jules validou o código."
          echo "Autor do Commit: ${{ github.actor }}"
          echo "Mensagem: ${{ github.event.head_commit.message }}"

      - name: 🐍 Setup Python para Teste Único
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar Pytest
        run: pip install pytest

      - name: 🧪 Rodar APENAS UM teste de sanidade
        run: |
          # Aqui ele roda apenas um arquivo de teste que você escolher
          # Exemplo: pytest app/tests/test_main.py
          echo "Simulando execução de teste em um único arquivo para economizar recursos..."
          pytest --version
          
      - name: 🚢 Deploy Simulado
        run: echo "Aqui o sistema iria para a AWS agora."