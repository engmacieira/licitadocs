name: CI - LicitaDocs Test Pipeline

# 🚦 GATILHOS (TRIGGERS)
on:
  push:
    # Roda em qualquer push, EXCETO quando o push for direto na main ou develop
    branches-ignore:
      - main
      - develop
  pull_request:
    # Roda sempre que um PR for aberto APONTANDO para a main ou develop
    branches:
      - main
      - develop

jobs:
  # ==========================================
  # 🐍 TESTES DO BACKEND (FASTAPI)
  # ==========================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    env:
      ENV: "test"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ORIGINS: "http://localhost:5173"
      SECRET_KEY: "chave_falsa_do_github_actions_para_testes"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      RESET_TOKEN_EXPIRE_MINUTES: 15
      EMAILS_FROM_NAME: "LicitaDocs CI"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5435/licitadocs_test"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    
    strategy:
      fail-fast: false 
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licitadocs_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-split pytest-asyncio
      
      - name: Run Migrations (Test DB)
        run: alembic upgrade head

      - name: Run Pytest (Shard ${{ matrix.shard }})
        run: python -m pytest --splits ${{ strategy.job-total }} --group ${{ matrix.shard }}

  # ==========================================
  # ⚛️ TESTES DO FRONTEND (REACT/VITE)
  # ==========================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest (Shard ${{ matrix.shard }})
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd frontend
          npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}