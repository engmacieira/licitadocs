name: 🧪 Jules Smoke Test

on:
  workflow_dispatch: # Permite que você clique em "Run workflow" manualmente no GitHub
  push:
    paths:
      - 'jules/smoke_test_jules.py' # Roda automaticamente se você mexer no teste

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install requests

      - name: Executar Teste de Conexão
        env:
          # AQUI É O PONTO CRÍTICO:
          # Garanta que o nome dentro de secrets.XXXXX seja exatamente 
          # o nome que você salvou no GitHub (ex: JULES_AI_API_KEY)
          JULES_API_KEY: ${{ secrets.JULES_AI_API_KEY }}
        run: python jules/smoke_test_jules.py