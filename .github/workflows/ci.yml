name: CI/CD - LicitaDoc Pipeline + JULES OPTIMIZATION

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 🤖 OTIMIZAÇÃO (SÓ RODA PARA O HUMANO)
  # ==========================================

  # ==========================================
  # 📊 FASE DOS TESTES
  # ==========================================
  backend-tests-coverage:
    if: contains(github.event.head_commit.message, '[run jules]')
    runs-on: ubuntu-latest

    env:
      ENV: "test"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ORIGINS: "http://localhost:5173"
      SECRET_KEY: "chave_falsa_do_github_actions"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      RESET_TOKEN_EXPIRE_MINUTES: 15
      EMAILS_FROM_NAME: "LicitaDocs CI"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5435/licitadocs_test"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licitadocs_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov # Adicionado pytest-cov
      
      - name: Run Migrations
        run: alembic upgrade head

      - name: Run Backend Tests with Coverage
        # O pytest-cov gera o coverage.json exigido pelo seu jules_coverage_fixer.py
        run: python -m pytest --cov=app --cov-report=json:coverage.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.json
          retention-days: 1

      - name: 📲 Notificar Telegram (Erro no Backend)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NOS TESTES (JULES): Backend*
            Seu commit falhou nos testes iniciais. O Jules não pôde iniciar a otimização. Corrija o código e tente novamente.

  frontend-tests-coverage:
    if: contains(github.event.head_commit.message, '[run jules]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests with Coverage
        run: |
          cd frontend
          # Gera o JSON de summary que o Jules espera
          npx vitest run --coverage.enabled --coverage.reporter=json-summary

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json
          retention-days: 1

      - name: 📲 Notificar Telegram (Erro no Frontend)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NOS TESTES (JULES): Frontend*
            O Vitest encontrou erros. O Jules foi abortado.

  # ==========================================
  # 🤖 FASE JULES OPTIMIZATION
  # ==========================================
  jules-optimization:
    needs: [backend-tests-coverage, frontend-tests-coverage]
    if: contains(github.event.head_commit.message, '[run jules]')
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar Dependências Mínimas
        run: pip install requests
      
      - name: 📥 Baixar Todos os Relatórios de Cobertura
        uses: actions/download-artifact@v4
        with:
          pattern: '*coverage*'
          merge-multiple: true

      - name: 📲 Notificar Telegram (Jules Iniciado)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🤖 *Jules AI Ativado*
            O Jules está analisando o código para criar testes, refatorar e preparar o Release! 🚀

      - name: 🤖 Acionar Jules Mission Control
        env:
          JULES_API_KEY: ${{ secrets.JULES_AI_API_KEY }}
        run: python jules/jules_mission_control.py

      - name: 📲 Notificar Telegram (Erro no Jules)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NA IA (Jules)*
            O script do Jules quebrou ou gerou código inválido. O commit automático foi cancelado por segurança.

  # ==========================================
  # 🚀 DEPLOY E TESTES (SÓ RODA PARA A IA)
  # ==========================================
  # ==========================================
  # 📊 FASE DOS TESTES
  # ==========================================
  backend-tests:
    if: "!contains(github.event.head_commit.message, '[run jules]')"
    runs-on: ubuntu-latest

    env:
      ENV: "test"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ORIGINS: "http://localhost:5173"
      SECRET_KEY: "chave_falsa_do_github_actions"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      RESET_TOKEN_EXPIRE_MINUTES: 15
      EMAILS_FROM_NAME: "LicitaDocs CI"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5435/licitadocs_test"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    
    strategy:
      fail-fast: false 
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: licitadocs_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-split pytest-asyncio
      
      - name: Run Migrations
        run: alembic upgrade head

      - name: Run Backend Tests (Shard ${{ matrix.shard }})
        run: python -m pytest --splits ${{ strategy.job-total }} --group ${{ matrix.shard }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: 📲 Notificar Telegram (Erro no Backend Test)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NOS TESTES: Backend*
            Ocorreu um erro ao rodar o Pytest. O deploy foi cancelado por segurança. 🛑
            
            👨‍💻 Autor: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            🔗 Link: [Ver log do erro](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  frontend-tests:
    if: "!contains(github.event.head_commit.message, '[run jules]')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests (Shard ${{ matrix.shard }})
        run: |
          cd frontend
          # 🟢 A MÁGICA: O Vitest divide os arquivos sozinho e roda a fatia certa!
          npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: 📲 Notificar Telegram (Erro no Frontend Test)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NOS TESTES: Frontend*
            O Vitest encontrou erros nos componentes React. O deploy foi interrompido. 🛑
            
            👨‍💻 Autor: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            🔗 Link: [Ver log do erro](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ==========================================
  # 🏗️ FASE DE CONSTRUÇÃO (CI - Build Pesado)
  # ==========================================
  build-frontend:
    needs: [frontend-tests, backend-tests] 
    if: contains(github.event.head_commit.message, '[run deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker (Frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/licitadocs-frontend:latest

      - name: 📲 Notificar Telegram (Erro no Build Docker)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NO BUILD: Docker Frontend*
            Houve um erro ao gerar a imagem no GitHub Registry. Verifique o Vite ou as dependências. 🛑
            
            👨‍💻 Autor: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            🔗 Link: [Ver log do erro](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ==========================================
  # 🚀 FASE DE DEPLOY (CD)
  # ==========================================
  deploy-staging:
    needs: [build-frontend] 
    name: Deploy para AWS EC2
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[run deploy]') ||
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      # --- PASSO 1: AGENDA O REBOOT ---
      - name: 🧹 Agendar Limpeza de Memória (Reboot)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Agendando reinicialização para liberar RAM..."
            # Agenda o reboot para daqui a 1 minuto exato
            sudo shutdown -r +1 "Limpando memoria para o Deploy"
            # Sai graciosamente para o GitHub não dar erro de conexão
            exit 0

      # --- PASSO 2: O RELÓGIO INTELIGENTE ---
      - name: ⏱️ Aguardar o Servidor Reiniciar
        run: |
          echo "Aguardando 80 segundos para o servidor iniciar o processo de desligamento..."
          sleep 80 
          
          MAX_TENTATIVAS=10
          TENTATIVA=1
          ESPERA=60
          
          echo "Iniciando verificação de pulso na porta SSH (22)..."
          
          while [ $TENTATIVA -le $MAX_TENTATIVAS ]; do
            echo "Tentativa $TENTATIVA de $MAX_TENTATIVAS..."
            
            # O Netcat (nc) tenta conectar na porta 22 por no máximo 5 segundos (-w 5)
            if nc -w 5 -z ${{ secrets.EC2_HOST }} 22; then
              echo "✅ PULSO DETECTADO! Servidor está online e aceitando conexões!"
              exit 0
            else
              echo "⏳ Servidor ainda offline. Aguardando mais $ESPERA segundos..."
              sleep $ESPERA
              TENTATIVA=$((TENTATIVA+1))
            fi
          done
          
          echo "🚨 ERRO FATAL: Tempo limite esgotado. O servidor não voltou após 10 tentativas."
          exit 1

      # --- PASSO 3: O DEPLOY REAL ---
      - name: Executando Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e  
            cd ~/licitadocs

            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

            # 🪂 1. O PARAQUEDAS (Backup antes de qualquer alteração)
            echo "A iniciar backup da base de dados..."
            docker compose exec -T postgres pg_dump -U postgres licitadocs_test > backup_$(date +%F_%H-%M-%S).sql || true
            
            # 🛑 2. A PARADA TÉCNICA (Desliga o sistema antigo para libertar 100% da RAM!)
            echo "A desligar os serviços para poupar memória..."
            docker compose -f docker-compose.staging.yaml down

            # 🧹 3. A FAXINA PROFUNDA (Agora que tudo está desligado, limpa o disco a sério)
            echo "A limpar o cache e imagens antigas do Docker..."
            docker system prune -af --volumes
            docker builder prune -af
            
            # 🚀 4. O DEPLOY (Constrói a versão nova com a máquina leve e fresca)
            echo "A construir a nova versão..."
            docker compose -f docker-compose.staging.yaml up -d --build

            # 🔄 5. MIGRATIONS
            echo "A atualizar a base de dados..."
            docker compose exec -T backend alembic upgrade head

            # 🩺 6. O TESTE DE PULSO (Health Check)
            echo "A aguardar 10 segundos para a aplicação iniciar..."
            sleep 10
            echo "A testar resposta do servidor..."
            curl --fail --silent http://localhost:8000/docs > /dev/null
            echo "✅ Servidor online e saudável!"

      # 📢 3. O MEGAFONE (Slack)
      # Este passo roda FORA do SSH, diretamente nos servidores do GitHub, e só dispara se o script acima não falhar.
      - name: Notificar Telegram (Sucesso)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *Novo Deploy - Licitadocs*
            O pipeline correu com sucesso e a nova versão já está na AWS! ✅
            
            👨‍💻 Autor: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            🔗 Commit: [Ver alterações](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
      
      - name: Notificar Telegram (Erro no Deploy)
        if: failure() # 🚨 Só dispara se algum passo anterior deste job falhar
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚨 *FALHA NO DEPLOY - LicitaDocs*
            Ocorreu um erro crítico durante o deploy para a AWS. O sistema pode estar instável ou a versão antiga permanece ativa. 🛑
            
            🔍 *Detalhes:*
            👨‍💻 Autor: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            🛠️ Job: ${{ github.job }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}