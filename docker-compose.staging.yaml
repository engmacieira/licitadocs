version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licitadocs_backend
    ports:
      - "8000:8000"
    environment:
      # Agora sim, todas as variáveis serão puxadas do arquivo .env do servidor
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: licitadocs_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
