version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licitadocs_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: ghcr.io/engmacieira/licitadocs-frontend:latest
    container_name: licitadocs_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
