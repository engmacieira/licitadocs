[pytest]
asyncio_mode = auto
filterwarnings =
    # Ignora o aviso de descontinuação específico da biblioteca do Google GenAI
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
    # Ignora avisos de descontinuação do Supabase Python Client
    ignore:The 'timeout' parameter is deprecated.*:DeprecationWarning
    ignore:The 'verify' parameter is deprecated.*:DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    asyncio: mark test as asyncio